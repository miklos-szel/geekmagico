          basicAuth: []
      description: "Connect to a WiFi network. Requires HTTP Basic credentials when auth is enabled on the device (off by default)."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                ssid:
                  type: "string"
                password:
                  type: "string"
              required:
                - "ssid"
                - "password"
              example:
                ssid: "MyNetwork"
                password: "password123"
        required: true
