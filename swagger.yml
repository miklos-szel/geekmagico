  /api/v1/wifi/scan:
    get:
      summary: "Scan WiFi networks (async, poll until done)"
      operationId: "op_v1_get_api_v1_wifi_scan"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
        401:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
      tags:
        - "WiFi"
      security:
        - 
          basicAuth: []
      description: "Scan WiFi networks (async, poll until done). Requires HTTP Basic credentials when auth is enabled on the device (off by default)."
  /api/v1/wifi/connect:
    post:
      summary: "Connect to a WiFi network"
      operationId: "op_v1_post_api_v1_wifi_connect"
