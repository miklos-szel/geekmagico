; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_filters = esp8266_exception_decoder, time, colorize
; Flash budget: firmware.bin must clear the stock updater's OTA ceiling.
; The -DNO_GLOBAL_SPIFFS / ARDUINOJSON / LOG_COMPILE_LEVEL flags and the lib_ignore
; list below are size measures, not preferences. See "OTA size ceiling" in CLAUDE.md.
build_flags = 
	-Iinclude
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
	-DNO_GLOBAL_SPIFFS
	-DARDUINOJSON_USE_DOUBLE=0
	-DARDUINOJSON_USE_LONG_LONG=0
	-DLOG_COMPILE_LEVEL=2
lib_ignore = 
	SD
	SDFS
	ESP8266SdFat
extra_scripts = 
	pre:scripts/git_version.py
	post:scripts/strip_scanf_float.py
check_tool = clangtidy
check_flags = 
	clangtidy: --checks=-*,bugprone-*,modernize-*,readability-*,modernize-use-trailing-return-type,-bugprone-easily-swappable-parameters --warnings-as-errors=*
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
	moononournation/GFX Library for Arduino@^1.6.4
	bitbank2/AnimatedGIF@^2.2.0
